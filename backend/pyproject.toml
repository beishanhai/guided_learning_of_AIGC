[project]
name = "chai-jing-backend"
version = "0.1.0"
description = "拆镜学后端：视频拆解与学习闭环"
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
