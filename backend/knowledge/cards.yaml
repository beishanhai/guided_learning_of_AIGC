version: k1
reviewer: "内容负责人（待签署）"
cards:
  - id: shot_scale_extreme_wide_v1
    topic: shot_scale
    title: "大远景与全景：先交代空间，再放人物"
    content: >-
      怎么判断：先看人物在画面高度里占多少。人物只有很小一点、环境占去大部分画面，通常算大远景；人物从头到脚完整入画、上下还留有余地，通常算全景。这两类景别把人物放回空间里，让人知道他在哪、和周围是什么关系。可以问自己：遮住人物，画面还能不能看懂这是哪里？能看懂，说明空间交代已经完成。容易失效或犯错：用大远景拍对话，观众看不清表情，只能靠台词；用全景交代细节，观众又要费力寻找重点。如果前后镜头没有更近的景别接住，空间交代容易变成一段没有信息量的空镜。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_scale","extreme_wide","wide","景别"]
    applicable_intents: ["shot_language"]
    examples: ["开场用一个全景让观众先认出街道和店铺，再切到人物","人物走到开阔地带时用大远景，交代他所处环境的尺度"]
    pitfalls: ["整段对话都用大远景，观众只能听到台词而读不到反应","全景之后没有近一点的镜头接住，信息落点不明确"]
    review_status: reviewed
  - id: shot_scale_medium_v1
    topic: shot_scale
    title: "中景：动作与对话的基准景别"
    content: >-
      怎么判断：画面大致切在人物腰部附近，人物占画面高度大约一半。中景能同时保留手势、身体朝向和一部分环境，适合说话、走动、递东西这类动作。判断时可以数一数：镜头里有没有需要看清的手部动作或身体姿态？有，中景能接住；没有，只是上半身说话，换成更近的景别可能更有效。容易失效或犯错：把中景当万能景别，整段都用它，画面缺少远近对比，节奏也显得平；另一种失误是把中景当近景用，指望它承担情绪爆发，但人物脸在画面里偏小，情绪传不到位。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_scale","medium","景别"]
    applicable_intents: ["shot_language"]
    examples: ["两人边走边谈，用中景同时看到步态和手势","递交物品时保持中景，让动作完整呈现"]
    pitfalls: ["整场戏只有中景，远景与近景都缺席，段落缺少层次","把情绪的落点放在中景上，脸部细节不足以支撑"]
    review_status: reviewed
  - id: shot_scale_close_up_v1
    topic: shot_scale
    title: "中近景与近景：让情绪进入画面"
    content: >-
      怎么判断：切在胸口附近算中近景，切在肩部以上、脸部占画面较大比例算近景。判断依据是眼睛和嘴角是否清晰可读：观众能不费力地看到眼神变化，这个景别就已经在承担情绪功能。近景适合一句关键台词、一次犹豫、一次落泪。容易失效或犯错：用近景拍环境信息，观众会丢失空间关系，不知道人物站在哪里；连续多个近景又会让画面缺少呼吸感。切得太早，观众还没建立空间就直接看到脸部，情绪没有铺垫可以依附。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_scale","medium_close","close_up","景别"]
    applicable_intents: ["shot_language"]
    examples: ["人物落泪时切近景，让情绪占据画面主体","关键台词说完后保留中近景，记录对方的即时反应"]
    pitfalls: ["用近景交代场所和方位，观众对空间感到混乱","连续五六个近景连排，画面闷而缺少节奏变化"]
    review_status: reviewed
  - id: shot_scale_extreme_close_up_v1
    topic: shot_scale
    title: "特写：把注意力锁在局部"
    content: >-
      怎么判断：画面只装下一个局部，比如眼睛、手、手机屏幕、杯口。判断标准是：这个局部本身是否携带关键信息，观众看完能不能获得一个新的事实。特写把注意力从空间和动作收缩到细节，常用于揭示线索或强调某个动作的结果。容易失效或犯错：特写用得太频繁，每次都变成强调，强调本身就不再起作用；用特写拍观众已经知道的东西，只是重复信息；特写之后不交代它与整体的关系，观众会不清楚这个局部属于谁、在什么地方。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_scale","extreme_close_up","特写","景别"]
    applicable_intents: ["shot_language"]
    examples: ["手指在桌下敲了三下，用特写把线索交给观众","信纸上的落款用特写，替代一句台词"]
    pitfalls: ["每个镜头都靠特写强调，重点被拉平","特写孤立出现，观众不知道它在哪个空间里"]
    review_status: reviewed
  - id: camera_motion_static_v1
    topic: camera_motion
    title: "固定镜头：先确认一个不动的基准"
    content: >-
      怎么判断：把同一镜头内的若干代表帧并排看，机位和取景范围基本不变，只有人物在动，通常可以判断为固定镜头。固定镜头提供一个稳定基准，观众能清楚看到动作的起止和走位。判断时要区分摄影机不动和画面没变化：人物走近同样会让画面变化量上升。容易失效或犯错：给固定镜头配上很短的时长，观众来不及看清动作；在需要跟随的信息上使用固定镜头，主体容易走出画面。只拿到单帧时，静止和缓慢移动看起来一样，需要连续帧比对。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["camera_motion","static","固定镜头"]
    applicable_intents: ["shot_language"]
    examples: ["一人坐在桌前听对方说话，机位不动，让细微表情成为重点","用固定镜头拍摄对称的门框与走位，交代空间结构"]
    pitfalls: ["固定镜头时长过短，动作还没看清就切走","快门式地连拍固定镜头，段落显得呆板"]
    review_status: reviewed
  - id: camera_motion_pan_tilt_v1
    topic: camera_motion
    title: "横摇与纵摇：机位不动，视线扫过"
    content: >-
      怎么判断：机位大致不动，取景中心沿水平方向扫过是横摇，沿垂直方向扫过是纵摇。判断依据是地平线或建筑边缘的位移方向，以及两端画面能不能拼成一段连续的空间。横摇常用于展示环境或跟随横向移动，纵摇常用于表现高度、上下打量。容易失效或犯错：摇得太快，观众只看到模糊的拖影，读不出扫过的是什么；摇到一半停住又找不到落点，注意力会悬空。只给单帧时，静止画面和摇摄中途的画面看起来一样，需要连续帧才能确认。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["camera_motion","pan","tilt","横摇","纵摇"]
    applicable_intents: ["shot_language"]
    examples: ["从空无一人的街道横摇到亮灯的窗口，把环境和信息连起来","人物进门后纵摇到墙上的钟，交代时间"]
    pitfalls: ["甩摇速度过快，画面只剩拖影，信息没有读出来","摇摄中途停顿又没有落点，观众注意力无处安放"]
    review_status: reviewed
  - id: camera_motion_dolly_zoom_v1
    topic: camera_motion
    title: "移动与变焦：位移和焦距不是一回事"
    content: >-
      怎么判断：画面里近处的物体相对远处的物体发生位移，说明机位在移动；如果远近物体的大小关系基本不变，只是整体被放大或缩小，更像变焦。两者观感不同：移动会改变前后景的相对关系，变焦接近把画面裁切放大。判断时可以盯住前景物体的边缘，看它和背景的相对位置有没有改变。容易失效或犯错：把变焦当成推近使用，背景被一起压平，空间的纵深感反而变弱；移动速度太快，观众先注意到摄影机而不是画面内容。单帧无法区分这两种变化。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["camera_motion","dolly","zoom","移动","变焦"]
    applicable_intents: ["shot_language"]
    examples: ["跟着人物穿过走廊移动，前后景关系持续变化","隔着人群缓慢变焦靠近目标，制造逐渐看清的感觉"]
    pitfalls: ["用快速变焦代替靠近，空间被压平，临场感减弱","只凭一帧判断是移动还是变焦，结论站不住"]
    review_status: reviewed
  - id: camera_motion_single_frame_limit_v1
    topic: camera_motion
    title: "单帧不能证明运镜：运镜要看连续帧"
    content: >-
      怎么判断：运镜是在时间上发生的变化，至少需要同一镜头内两帧以上、而且顺序正确，才能看出位移的方向。只有一张代表帧时，只能描述那一刻的取景，不能证明摄影机在动。手持的抖动通常表现为连续帧之间小幅、无规律的位移，需要看一串帧才能和固定镜头区分开。容易失效或犯错：把画面变化量直接当成运镜证据，主体自身的运动、快速切换、画面内物体的移动都会造成同样的变化；代表帧的间隔太大时，中间的运动被跳过，判断会偏向漏判或误判。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["camera_motion","handheld","shot_motion_evidence","运镜证据","手持"]
    applicable_intents: ["shot_language","narrative_rhythm"]
    examples: ["要判断一个镜头是否手持，至少抽取首中尾三帧并对照抖动方向","怀疑有推近时，把同一镜头内多帧按时间排序再确认"]
    pitfalls: ["看到画面模糊就断言手持，忽略了运动模糊和焦外模糊","代表帧间隔过大，中间发生的运镜被整段跳过"]
    review_status: reviewed
  - id: composition_rule_of_thirds_v1
    topic: composition
    title: "三分位置：让视线先落在主体上"
    content: >-
      怎么判断：把画面横竖各分三等份，主体或视线落点在分割线附近，就是常见的三分位置。判断依据是主体到画面边缘的距离是否明显不对称，以及观众的视线是否先落在主体上。居中构图给人稳定、正视的感觉，偏置构图更容易带出方向感和被观察感。容易失效或犯错：为了对齐分割线而把主体压到边缘，人物像要被挤出画面；主体和背景里的强线条争抢注意力，落点就被冲淡。三分法是参考，不是判断画面好坏的唯一依据。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["composition","rule_of_thirds","构图"]
    applicable_intents: ["shot_language"]
    examples: ["人物站在画面左三分之一处，右侧留出他望去的方向","把地平线放在下三分之一，突出天空的开阔"]
    pitfalls: ["一味追求分割线，主体被顶到边缘，画面失去平衡","背景强线条穿过主体头部，视线落点被干扰"]
    review_status: reviewed
  - id: composition_eyeline_space_v1
    topic: composition
    title: "视线方向与留白：给目光留出通道"
    content: >-
      怎么判断：看人物面朝哪一侧，以及那一侧有没有留出空间。人物看向画面右侧时，右侧留白多一些，观众的视线会顺着他看的方向延伸出去。头顶空间太小显得压抑，太大又显得空，可以对照人物眼睛到画面上沿的距离来判断。容易失效或犯错：人物朝左看却被贴在画面左边缘，视线像撞墙一样没有去处；前后两个镜头里人物朝向和留白方向相反，观众会以为他在看另一边。留白的作用是给视线留通道，不是越空越好。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["composition","eyeline","headroom","视线方向"]
    applicable_intents: ["shot_language"]
    examples: ["人物望向窗外时，把留白放在他视线一侧","对话镜头里保持一致的朝向，让观众知道双方在看彼此"]
    pitfalls: ["朝左看却把人物放在左边缘，视线没有去处","相邻镜头留白方向反复跳变，空间感被破坏"]
    review_status: reviewed
  - id: composition_visual_weight_v1
    topic: composition
    title: "画面重心与留白：注意力落在哪里"
    content: >-
      怎么判断：眯起眼看画面，注意力自然落在哪里，那里就是画面的重心。亮部、高饱和色、人脸、运动中的物体都会加重分量。留白则是画面里相对空的区域，用来衬托主体、制造停顿。判断时可以问：遮住主体后，画面里是否还有一处同样抢眼的东西？有，说明重心被分散了。容易失效或犯错：把留白理解成什么都不放，结果画面空而没有指向；主体太小又贴着边角，观众要花时间寻找，信息传递变慢。多主体同框时，还要看它们的分量有没有排出层次。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["composition","visual_weight","negative_space","留白","画面重心"]
    applicable_intents: ["shot_language"]
    examples: ["把亮色道具放在人物视线终点，让重心明确","用大面积阴影留白压住画面，突出孤立的人物"]
    pitfalls: ["留白处又亮又花，注意力被牵走","主体与背景元素分量相当，观众找不到重点"]
    review_status: reviewed
  - id: shot_relation_shot_reverse_shot_v1
    topic: shot_relation
    title: "正反打：把对话拆成两个方向"
    content: >-
      怎么判断：两个人对话时，镜头在两人之间来回切换，各自被单独取景，通常就是正反打。判断依据是相邻镜头里人物的朝向大致相反、彼此在画面中被安排在对侧，观众因此能拼出两人面对面的空间。正反打适合把注意力和台词交给其中一方。容易失效或犯错：两个机位都偏离轴线到了同一侧，观众会觉得两人看着同一个方向而不是对视；切换时景别差异太大，会显得突兀。若中间插入与对话无关的镜头，来回切换的连贯感会被打断。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_relation","shot_reverse_shot","正反打"]
    applicable_intents: ["shot_language"]
    examples: ["一问一答的对话用正反打，台词和反应都有落点","争执升级时缩短单侧镜头时长，加快来回切换"]
    pitfalls: ["两侧机位落在轴线同一侧，人物看起来没有对视","正反打两侧景别相差过大，切换时显得跳跃"]
    review_status: reviewed
  - id: shot_relation_eyeline_match_v1
    topic: shot_relation
    title: "视线匹配：让看与所看对得上"
    content: >-
      怎么判断：前一镜头里人物抬头或转头看向画外，后一镜头出现他看的东西，两处的视线高度和左右方向大致对应，就形成了视线匹配。判断时可以核对两点：看向的方向和之后出现的对象方位是否一致，视线的高度是否落在合理的位置。容易失效或犯错：人物往上看向天花板，下一个镜头却是平视的物品，观众会以为他在看别的东西；中间插入过多镜头，视线衔接被稀释。视线匹配靠的是方位对应，不是内容相似。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_relation","eyeline_match","视线匹配"]
    applicable_intents: ["shot_language"]
    examples: ["人物抬头看向画外，下一镜头接树上的一只鸟","两个人先后看向画外同一方向，暗示他们在看同一样东西"]
    pitfalls: ["视线高度不匹配，观众误以为在看别处","目光与对象之间插入太多镜头，联系被冲淡"]
    review_status: reviewed
  - id: shot_relation_crossing_axis_v1
    topic: shot_relation
    title: "越轴：左右关系为什么会突然对调"
    content: >-
      怎么判断：在两人或双方关系的场景里，先找到连接他们的那条想象线，也就是轴线。同一段落里机位停留在轴线同侧，人物的左右关系保持稳定；如果跨到另一侧，两人在画面里的左右位置就互换，这属于越轴。越轴本身不算错误，只是会让观众短暂迷失方向。判断时看人物在画面中的左右位置是否突然对调。容易失效或犯错：没有必要时越轴，观众会以为空间变了；确实要越轴时，中间没有用一个过渡镜头或移动镜头交代机位变化，空间关系就断了。
    source: "影视镜头语言通用教材与公开课程共识，由内容负责人审校"
    reviewer: "内容负责人（待签署）"
    version: k1
    tags: ["shot_relation","axis_line","crossing_the_axis","越轴"]
    applicable_intents: ["shot_language"]
    examples: ["用一段横摇穿过轴线，把两人位置的自然变化交代清楚","先拍一个中性方向的环境镜头，再切到轴线另一侧"]
    pitfalls: ["在对话中无故越轴，观众以为换了场地","越轴前没有过渡镜头，左右关系对调得莫名其妙"]
