    tags: ["shot_motion_evidence","observation_limit","观察指标","局限性"]
    applicable_intents: ["shot_language","narrative_rhythm"]
    examples: ["把变化量分区域统计，看主要集中在画面中央还是边缘","同一条素材内横向比较各镜头的变化量，不跨素材比"]
    pitfalls: ["跨不同分辨率的素材比较变化量数值，结论失真","只看数值排序，忽略镜头里实际发生了什么"]
